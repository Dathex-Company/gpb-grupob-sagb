
<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="https://static.wixstatic.com/media/64c3dc_866011d493924761b15d6162e82c4948~mv2.png" />
    <link rel="shortcut icon" type="image/png" href="https://static.wixstatic.com/media/64c3dc_866011d493924761b15d6162e82c4948~mv2.png" />
    <link rel="apple-touch-icon" href="https://static.wixstatic.com/media/64c3dc_866011d493924761b15d6162e82c4948~mv2.png" />
    <title>SagB - GrupoB</title>
    <!-- 🟢 [1] CARREGA O TAILWIND VIA CDN + PLUGIN TYPOGRAPHY -->
    <!-- 🟢 Use esta linha se quiser remover/adicionar plugins globais do Tailwind -->
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>

    <!-- 🟢 [2] OTIMIZAÇÃO DE FONTES (PRECONNECT) -->
    <!-- 🟢 Mantém o carregamento da fonte mais rápido -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- 🟢 [3] FONTE GLOBAL BAIXADA DO GOOGLE FONTS -->
    <!-- 🟢 Aqui você troca a família (ex.: Inter, Rubik, Poppins...) e os pesos disponíveis -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      // 🟢 [4] CONFIGURAÇÃO GLOBAL DO TAILWIND (INLINE)
      // 🟢 Tudo aqui impacta o sistema inteiro
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              // 🟢 [4.1] FONTE PADRÃO UTILIZADA QUANDO UMA TELA USA "font-sans"
              sans: ['Inter', 'sans-serif'],
              // 🟢 [4.2] Alias "font-nunito" também apontando para Inter
              // 🟢 Se quiser separar no futuro, altere só esta linha
              nunito: ['Inter', 'sans-serif'],
            },
            colors: {
              // 🟢 [4.3] PALETA DE CORES CUSTOMIZADA DO SISTEMA
              bitrix: {
                nav: '#111827',
                accent: '#7C3AED',
                text: '#1F2937',
                secondary: '#6B7280',
                border: '#E5E7EB',
                surface: '#FFFFFF'
              },
              // [4.4] SAGB OFFICIAL TOKENS (CSS VARIABLES)
              sagb: {
                bg: 'var(--sagb-bg)',
                'bg-2': 'var(--sagb-bg-2)',
                panel: 'var(--sagb-panel)',
                'panel-2': 'var(--sagb-panel-2)',
                line: 'var(--sagb-line)',
                text: 'var(--sagb-text)',
                muted: 'var(--sagb-muted)',
                blue: 'var(--sagb-blue)',
                'blue-2': 'var(--sagb-blue-2)',
                green: 'var(--sagb-green)',
                amber: 'var(--sagb-amber)',
                red: 'var(--sagb-red)',
              }
            },
            backgroundImage: {
              'gradient-panels': 'var(--sagb-gradient-panels)',
              'gradient-brand': 'var(--sagb-gradient-brand)',
              'gradient-menu-active': 'var(--sagb-gradient-menu-active)',
              'gradient-search': 'linear-gradient(180deg, #20242b, #1f2329)',
              'gradient-button': 'linear-gradient(180deg, #262a31, #23272e)',
              'gradient-tag': 'linear-gradient(180deg, #20242a, #1e2228)',
              'gradient-switch-off': 'linear-gradient(180deg, #23262d, #1f2329)',
              'gradient-switch-on': 'linear-gradient(180deg, #0d67c5, #0a84ff)',
              'gradient-switch-handle': 'linear-gradient(180deg, #fbfcff, #d8dfeb)',
            },
            boxShadow: {
              sm: '0 1px 2px rgba(0, 0, 0, 0.01)',
              DEFAULT: '0 1px 3px rgba(0, 0, 0, 0.02)',
              md: '0 4px 6px -1px rgba(0, 0, 0, 0.02)',
              lg: '0 10px 15px -3px rgba(0, 0, 0, 0.02)',
              xl: '0 20px 25px -5px rgba(0, 0, 0, 0.03)',
              '2xl': '0 25px 50px -12px rgba(0, 0, 0, 0.03)',
              inner: 'inset 0 2px 4px 0 rgba(0, 0, 0, 0.01)',
              'soft': '0 2px 10px rgba(0, 0, 0, 0.01)',
              'hover': '0 20px 40px rgba(0, 0, 0, 0.02)',
              none: 'none',
            }
          },
        },
      }
    </script>
    <style>
      :root {
        /* Light Mode Defaults */
        --sagb-bg: #FFFFFF;
        --sagb-bg-2: #F9FAFB;
        --sagb-panel: #FFFFFF;
        --sagb-panel-2: #F9FAFB;
        --sagb-line: rgba(0,0,0,.05);
        --sagb-text: #1F2937;
        --sagb-muted: #6B7280;
        --sagb-blue: #3B82F6;
        --sagb-blue-2: #2563EB;
        --sagb-green: #10B981;
        --sagb-amber: #F59E0B;
        --sagb-red: #EF4444;

        --sagb-gradient-panels: linear-gradient(180deg, #FFFFFF, #F9FAFB);
        --sagb-gradient-brand: linear-gradient(135deg, #3B82F6, #2563EB);
        --sagb-gradient-menu-active: linear-gradient(180deg, #EFF6FF, #DBEAFE);
      }

      .dark {
        /* Desativado Dark visual - força cores claras (Light/Cora) */
        --sagb-bg: #FFFFFF;
        --sagb-bg-2: #F9FAFB;
        --sagb-panel: #FFFFFF;
        --sagb-panel-2: #F9FAFB;
        --sagb-line: rgba(0,0,0,.05);
        --sagb-text: #1F2937;
        --sagb-muted: #6B7280;
        --sagb-blue: #3B82F6;
        --sagb-blue-2: #2563EB;
        --sagb-green: #10B981;
        --sagb-amber: #F59E0B;
        --sagb-red: #EF4444;

        --sagb-gradient-panels: linear-gradient(180deg, #FFFFFF, #F9FAFB);
        --sagb-gradient-brand: linear-gradient(135deg, #3B82F6, #2563EB);
        --sagb-gradient-menu-active: linear-gradient(180deg, #EFF6FF, #DBEAFE);
      }

      /* 🟢 [5] ESTILO GLOBAL DA BARRA DE SCROLL */
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }
      
      /* 🟢 [6] ESTILOS GLOBAIS DO BODY (APLICA NA APP INTEIRA) */
      body { 
        font-family: 'Inter', sans-serif;
        -webkit-font-smoothing: antialiased; 
        -moz-osx-font-smoothing: grayscale;
        background-color: var(--sagb-bg);
        color: var(--sagb-text);
      }

      /* 🟢 [7] ANIMAÇÃO PADRÃO DE ENTRADA DE MENSAGENS/CARDS */
      @keyframes slideUp {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-msg {
        animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      /* 🟢 [8] AJUSTES DE TIPOGRAFIA PARA CONTEÚDO RICO (MARKDOWN/PROSE) */
      .prose {
        max-width: none;
      }
      .prose p { margin-bottom: 0.75rem; line-height: 1.7; }
      .prose strong { color: #111827; font-weight: 600; }
      
      /* 🟢 [9] SUAVIZAÇÃO DE INPUTS E FOCO GLOBAL */
      input, textarea, select {
        transition: all 0.2s ease;
      }
      input:focus, textarea:focus, select:focus {
        box-shadow: 0 0 0 2px rgba(124, 58, 237, 0.1);
      }

      /* 🟢 [10] ESTILOS DE FALLBACK PARA O COMPONENTE AUTH */
      /* 🟢 Garante que o componente de login seja visível mesmo se o Tailwind falhar */
      .auth-fallback {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #f9fafb;
        padding: 1.5rem;
      }
      .auth-fallback.dark {
        background-color: #0b0f19;
      }
      .auth-card {
        width: 100%;
        max-width: 28rem;
        background-color: white;
        border-radius: 2.5rem;
        padding: 2.5rem;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.04);
        border: 1px solid rgba(0, 0, 0, 0.05);
      }
      .auth-card.dark {
        background-color: #24272e;
        border-color: rgba(255, 255, 255, 0.05);
      }
      .auth-title {
        font-size: 1.5rem;
        font-weight: 900;
        color: #111827;
        margin-bottom: 0.5rem;
        text-align: center;
      }
      .auth-title.dark {
        color: #edf2fb;
      }
      .auth-input {
        width: 100%;
        background-color: #f9fafb;
        border: 1px solid #e5e7eb;
        border-radius: 1rem;
        padding: 1rem 1.5rem;
        font-size: 0.875rem;
        font-weight: 500;
        color: #374151;
        outline: none;
        margin-bottom: 1rem;
      }
      .auth-input.dark {
        background-color: #202329;
        border-color: rgba(255, 255, 255, 0.1);
        color: #edf2fb;
      }
      .auth-input:focus {
        box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
      }
      .auth-button {
        width: 100%;
        background-color: #111827;
        color: white;
        font-weight: 900;
        padding: 1rem;
        border-radius: 1rem;
        border: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
      }
      .auth-button:hover {
        background-color: #1f2937;
      }
      .auth-button:active {
        transform: scale(0.98);
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.33.0",
    "react-markdown": "https://esm.sh/react-markdown@^10.1.0",
    "vite": "https://esm.sh/vite@^7.3.0",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
  }
}
</script>

</head>
  <!-- 🟢 [10] CLASSES BASE DO BODY VIA TAILWIND -->
  <!-- 🟢 h-screen/overflow-hidden/bg/text controlam o layout base da aplicação -->
  <body class="h-screen overflow-hidden bg-gray-50 text-gray-900 dark:bg-[#0B0F19] dark:text-white transition-colors duration-300">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
  <script>
    // Script de diagnóstico para verificar carregamento do Tailwind
    window.addEventListener('load', function() {
      console.log('Página carregada - verificando Tailwind...');
      
      // Verifica se o Tailwind está carregado
      setTimeout(function() {
        const testElement = document.createElement('div');
        testElement.className = 'hidden';
        document.body.appendChild(testElement);
        
        const computedStyle = window.getComputedStyle(testElement);
        const displayValue = computedStyle.display;
        
        console.log('Teste Tailwind:', {
          displayValue: displayValue,
          tailwindLoaded: displayValue === 'none',
          bodyClasses: document.body.className,
          rootElement: document.getElementById('root') ? 'present' : 'missing'
        });
        
        document.body.removeChild(testElement);
        
        // Verifica se há erros no console
        if (typeof tailwind === 'undefined') {
          console.error('Tailwind não carregado via CDN!');
          // Aplica estilos de fallback
          document.body.classList.add('auth-fallback');
        } else {
          console.log('Tailwind carregado com sucesso');
        }
      }, 1000);
    });
  </script>
</body>
</html>
