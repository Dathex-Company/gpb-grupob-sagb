
<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="https://static.wixstatic.com/media/64c3dc_866011d493924761b15d6162e82c4948~mv2.png" />
    <link rel="shortcut icon" type="image/png" href="https://static.wixstatic.com/media/64c3dc_866011d493924761b15d6162e82c4948~mv2.png" />
    <link rel="apple-touch-icon" href="https://static.wixstatic.com/media/64c3dc_866011d493924761b15d6162e82c4948~mv2.png" />
    <title>SagB - GrupoB</title>
    <!-- 🟢 [1] CARREGA O TAILWIND VIA CDN + PLUGIN TYPOGRAPHY -->
    <!-- 🟢 Use esta linha se quiser remover/adicionar plugins globais do Tailwind -->
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>

    <!-- 🟢 [2] OTIMIZAÇÃO DE FONTES (PRECONNECT) -->
    <!-- 🟢 Mantém o carregamento da fonte mais rápido -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- 🟢 [3] FONTE GLOBAL BAIXADA DO GOOGLE FONTS -->
    <!-- 🟢 Aqui você troca a família (ex.: Inter, Rubik, Poppins...) e os pesos disponíveis -->
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
      // 🟢 [4] CONFIGURAÇÃO GLOBAL DO TAILWIND (INLINE)
      // 🟢 Tudo aqui impacta o sistema inteiro
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              // 🟢 [4.1] FONTE PADRÃO — RUBIK (Robust Clean)
              sans: ['Rubik', 'sans-serif'],
              // 🟢 [4.2] Aliases mantidos apontando para Rubik
              rubik: ['Rubik', 'sans-serif'],
            },
            colors: {
              // [4.4] SAGB OFFICIAL TOKENS (CSS VARIABLES)
              sagb: {
                bg: 'var(--sagb-bg)',
                surface: 'var(--sagb-surface)',
                line: 'var(--sagb-line)',
                text: 'var(--sagb-text)',
                muted: 'var(--sagb-muted)',
                primary: 'var(--sagb-primary)',
                blue: 'var(--sagb-blue)',
                red: 'var(--sagb-red)',
                amber: 'var(--sagb-amber)',
              }
            },
            boxShadow: {
              soft: '0 12px 30px rgba(48,56,66,.07)',
              DEFAULT: '0 4px 12px rgba(48,56,66,.05)',
              md: '0 8px 20px rgba(48,56,66,.06)',
              lg: '0 12px 30px rgba(48,56,66,.07)',
              xl: '0 20px 40px rgba(48,56,66,.08)',
              none: 'none',
            },
            borderRadius: {
              sm: '10px',
              md: '14px',
              lg: '18px',
              xl: '22px',
            }
          },
        },
      }
    </script>
    <style>
      :root {
        /* 🟢 Robust Clean Palette — Light Mode */
        --sagb-bg: #F2F4F6;
        --sagb-surface: #FFFFFF;
        --sagb-surface-soft: #FAFBFC;
        --sagb-line: rgba(48,56,66,.08);
        --sagb-text: #303842;
        --sagb-muted: #8892A0;
        --sagb-primary: #2FA99C;
        --sagb-primary-soft: rgba(47,169,156,.10);
        --sagb-primary-hover: #269286;
        --sagb-blue: #5D86BC;
        --sagb-blue-soft: rgba(93,134,188,.10);
        --sagb-red: #C85E62;
        --sagb-red-soft: rgba(200,94,98,.10);
        --sagb-amber: #D4953A;
        --sagb-amber-soft: rgba(212,149,58,.10);
        --sagb-shadow: 0 12px 30px rgba(48,56,66,.07);
        --sagb-radius-sm: 10px;
        --sagb-radius-md: 14px;
        --sagb-radius-xl: 22px;
      }

      .dark {
        /* 🟢 Robust Clean Palette — Dark Mode (mesma paleta com bg escuro) */
        --sagb-bg: #1A1D23;
        --sagb-surface: #23272E;
        --sagb-surface-soft: #1E2128;
        --sagb-line: rgba(255,255,255,.06);
        --sagb-text: #E8EDF5;
        --sagb-muted: #8892A0;
        --sagb-primary: #2FA99C;
        --sagb-primary-soft: rgba(47,169,156,.15);
        --sagb-primary-hover: #33BDB0;
        --sagb-blue: #5D86BC;
        --sagb-blue-soft: rgba(93,134,188,.15);
        --sagb-red: #C85E62;
        --sagb-red-soft: rgba(200,94,98,.15);
        --sagb-amber: #D4953A;
        --sagb-amber-soft: rgba(212,149,58,.15);
        --sagb-shadow: 0 12px 30px rgba(0,0,0,.25);
        --sagb-radius-sm: 10px;
        --sagb-radius-md: 14px;
        --sagb-radius-xl: 22px;
      }

      /* 🟢 [5] ESTILO GLOBAL DA BARRA DE SCROLL */
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(48,56,66,0.15); border-radius: 10px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(48,56,66,0.25); }
      
      /* 🟢 [6] ESTILOS GLOBAIS DO BODY (APLICA NA APP INTEIRA) */
      body {
        font-family: 'Rubik', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background-color: var(--sagb-bg);
        color: var(--sagb-text);
      }

      /* 🟢 [7] SELEÇÃO DE TEXTO — primary tone */
      ::selection {
        background-color: var(--sagb-primary-soft);
        color: var(--sagb-text);
      }

      /* 🟢 [8] ANIMAÇÃO PADRÃO DE ENTRADA DE MENSAGENS/CARDS */
      @keyframes slideUp {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-msg {
        animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      /* 🟢 [8] AJUSTES DE TIPOGRAFIA PARA CONTEÚDO RICO (MARKDOWN/PROSE) */
      .prose {
        max-width: none;
      }
      .prose p { margin-bottom: 0.75rem; line-height: 1.7; }
      .prose strong { color: var(--sagb-text); font-weight: 600; }
      
      /* 🟢 [9] SUAVIZAÇÃO DE INPUTS E FOCO GLOBAL */
      input, textarea, select {
        transition: all 0.2s ease;
      }
      input:focus, textarea:focus, select:focus {
        box-shadow: 0 0 0 2px var(--sagb-primary-soft);
        border-color: var(--sagb-primary);
      }

      /* 🟢 [10] ESTILOS DE FALLBACK PARA O COMPONENTE AUTH */
      /* 🟢 Garante que o componente de login seja visível mesmo se o Tailwind falhar */
      .auth-fallback {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #f9fafb;
        padding: 1.5rem;
      }
      .auth-fallback.dark {
        background-color: #0b0f19;
      }
      .auth-card {
        width: 100%;
        max-width: 28rem;
        background-color: white;
        border-radius: 2.5rem;
        padding: 2.5rem;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.04);
        border: 1px solid rgba(0, 0, 0, 0.05);
      }
      .auth-card.dark {
        background-color: #24272e;
        border-color: rgba(255, 255, 255, 0.05);
      }
      .auth-title {
        font-size: 1.5rem;
        font-weight: 900;
        color: #111827;
        margin-bottom: 0.5rem;
        text-align: center;
      }
      .auth-title.dark {
        color: #edf2fb;
      }
      .auth-input {
        width: 100%;
        background-color: #f9fafb;
        border: 1px solid #e5e7eb;
        border-radius: 1rem;
        padding: 1rem 1.5rem;
        font-size: 0.875rem;
        font-weight: 500;
        color: #374151;
        outline: none;
        margin-bottom: 1rem;
      }
      .auth-input.dark {
        background-color: #202329;
        border-color: rgba(255, 255, 255, 0.1);
        color: #edf2fb;
      }
      .auth-input:focus {
        box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
      }
      .auth-button {
        width: 100%;
        background-color: #111827;
        color: white;
        font-weight: 900;
        padding: 1rem;
        border-radius: 1rem;
        border: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
      }
      .auth-button:hover {
        background-color: #1f2937;
      }
      .auth-button:active {
        transform: scale(0.98);
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.33.0",
    "react-markdown": "https://esm.sh/react-markdown@^10.1.0",
    "vite": "https://esm.sh/vite@^7.3.0",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
  }
}
</script>

</head>
  <!-- 🟢 [10] CLASSES BASE DO BODY VIA TAILWIND -->
  <!-- 🟢 h-screen/overflow-hidden/bg/text controlam o layout base da aplicação -->
  <body class="h-screen overflow-hidden transition-colors duration-300" style="background-color: var(--sagb-bg); color: var(--sagb-text);">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
  <script>
    // Script de diagnóstico para verificar carregamento do Tailwind
    window.addEventListener('load', function() {
      console.log('Página carregada - verificando Tailwind...');
      
      // Verifica se o Tailwind está carregado
      setTimeout(function() {
        const testElement = document.createElement('div');
        testElement.className = 'hidden';
        document.body.appendChild(testElement);
        
        const computedStyle = window.getComputedStyle(testElement);
        const displayValue = computedStyle.display;
        
        console.log('Teste Tailwind:', {
          displayValue: displayValue,
          tailwindLoaded: displayValue === 'none',
          bodyClasses: document.body.className,
          rootElement: document.getElementById('root') ? 'present' : 'missing'
        });
        
        document.body.removeChild(testElement);
        
        // Verifica se há erros no console
        if (typeof tailwind === 'undefined') {
          console.error('Tailwind não carregado via CDN!');
          // Aplica estilos de fallback
          document.body.classList.add('auth-fallback');
        } else {
          console.log('Tailwind carregado com sucesso');
        }
      }, 1000);
    });
  </script>
</body>
</html>
