# Configuração de Teste de Carga para API SagB
# Ferramenta: k6 (https://k6.io)
# Uso: k6 run tests/load/api-sagb-load-test.yml

---
# meta
schema: k6-script-v1
name: api-sagb-load-test
description: >
  Teste de carga para validar throughput, latência e comportamento
  dos endpoints da API SagB sob diferentes cenários de estresse.

# Configuração global
options:
  vus: 10                    # Usuários virtuais simultâneos (baseline)
  duration: 30s              # Duração do teste
  thresholds:
    http_req_duration: ["p(95)<3000", "p(99)<5000"]
    http_req_failed: ["rate<0.01"]
    checks: ["rate>0.99"]
  stages:
    - duration: 10s
      target: 5              # Rampa de subida: 5 VUs
    - duration: 20s
      target: 20             # Carga média: 20 VUs
    - duration: 10s
      target: 50             # Pico: 50 VUs
    - duration: 10s
      target: 0              # Rampa de descida

# Configuração de ambiente
env:
  BASE_URL: "https://api-sandbox.sagb.com.br"
  API_KEY: "${API_SAGB_TEST_KEY}"
  API_KEY_READ: "${API_SAGB_TEST_KEY_READ}"

# --- Cenários de Teste ---

scenarios:
  health_check:
    executor: constant-vus
    vus: 5
    duration: 30s
    exec: healthCheck

  taskzei_read:
    executor: ramping-vus
    start_vus: 0
    stages:
      - duration: 10s
        target: 10
      - duration: 20s
        target: 30
    exec: taskzeiListNotifications
    env:
      RECIPIENT_ID: "test-user-001"

  crm_read_write:
    executor: per-vu-iterations
    vus: 5
    iterations: 10
    exec: crmCreateAndList
    max_duration: 30s

  studio_read:
    executor: constant-vus
    vus: 3
    duration: 20s
    exec: studioListProjects

  vox_transcribe:
    executor: per-vu-iterations
    vus: 2
    iterations: 5
    exec: voxTranscribe
    max_duration: 30s

# --- Funções de Teste (exec) ---

functions:
  healthCheck: |
    export default function () {
      const res = http.get(`${__ENV.BASE_URL}/api-sagb/v1/health`, {
        headers: {
          'X-API-Key': __ENV.API_KEY,
          'Content-Type': 'application/json',
        },
      });

      check(res, {
        'health status is 200': (r) => r.status === 200,
        'response has status ok': (r) => r.json().status === 'ok',
      });

      rate_health.add(1, res.status === 200);
    }

  taskzeiListNotifications: |
    export default function () {
      const params = {
        headers: {
          'X-API-Key': __ENV.API_KEY,
          'Content-Type': 'application/json',
        },
      };

      const res = http.get(
        `${__ENV.BASE_URL}/api-sagb/v1/taskzei/notifications?recipient_id=${__ENV.RECIPIENT_ID}&limit=10`,
        params,
      );

      check(res, {
        'taskzei list status is 200': (r) => r.status === 200,
        'response has notifications': (r) => r.json().notifications !== undefined,
      });

      rate_taskzei_read.add(1, res.status === 200);

      // Teste de notificação individual
      if (__ITER > 0 && __ITER % 3 === 0) {
        const sendRes = http.post(
          `${__ENV.BASE_URL}/api-sagb/v1/taskzei/notifications`,
          JSON.stringify({
            title: `Load Test ${Date.now()}`,
            message: 'Test notification from k6 load test',
            type: 'info',
            recipient_ids: [__ENV.RECIPIENT_ID],
          }),
          { headers: params.headers },
        );

        check(sendRes, {
          'taskzei send status is 201': (r) => r.status === 201,
        });

        rate_taskzei_write.add(1, sendRes.status === 201);
      }
    }

  crmCreateAndList: |
    export default function () {
      const headers = {
        'X-API-Key': __ENV.API_KEY,
        'Content-Type': 'application/json',
      };

      // Cria lead
      const createRes = http.post(
        `${__ENV.BASE_URL}/api-sagb/v1/crm/leads`,
        JSON.stringify({
          name: `Load Test Lead ${Date.now()}`,
          email: `lead-${__VU}-${__ITER}@test.sagb.com.br`,
          notes: 'Created during k6 load test',
        }),
        { headers },
      );

      check(createRes, {
        'crm create status is 201': (r) => r.status === 201,
      });

      rate_crm_write.add(1, createRes.status === 201);

      // Lista leads
      const listRes = http.get(
        `${__ENV.BASE_URL}/api-sagb/v1/crm/leads?limit=20`,
        { headers },
      );

      check(listRes, {
        'crm list status is 200': (r) => r.status === 200,
      });

      rate_crm_read.add(1, listRes.status === 200);
    }

  studioListProjects: |
    export default function () {
      const headers = {
        'X-API-Key': __ENV.API_KEY,
        'Content-Type': 'application/json',
      };

      const res = http.get(
        `${__ENV.BASE_URL}/api-sagb/v1/studio/projects`,
        { headers },
      );

      check(res, {
        'studio list status is 200': (r) => r.status === 200,
        'response has projects': (r) => r.json().projects !== undefined,
      });

      rate_studio_read.add(1, res.status === 200);
    }

  voxTranscribe: |
    export default function () {
      const headers = {
        'X-API-Key': __ENV.API_KEY,
        'Content-Type': 'application/json',
      };

      const res = http.post(
        `${__ENV.BASE_URL}/api-sagb/v1/vox/transcriptions`,
        JSON.stringify({
          audio_url: 'https://test-files.sagb.com.br/audio/test-sample.mp3',
          language: 'pt-BR',
        }),
        { headers },
      );

      check(res, {
        'vox transcribe status is 201': (r) => r.status === 201,
        'response has transcription': (r) => r.json().transcription !== undefined,
      });

      rate_vox_write.add(1, res.status === 201);
    }

# --- Métricas Customizadas ---

metrics:
  rate_health:
    type: rate
  rate_taskzei_read:
    type: rate
  rate_taskzei_write:
    type: rate
  rate_crm_read:
    type: rate
  rate_crm_write:
    type: rate
  rate_studio_read:
    type: rate
  rate_vox_write:
    type: rate
