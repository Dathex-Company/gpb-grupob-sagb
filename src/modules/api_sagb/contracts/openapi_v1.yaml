openapi: 3.0.3
info:
  title: API SagB
  version: 1.1.1
  description: API Oficial do ecossistema SagB em /api-sagb/v1 para sistemas, módulos, integrações, Hub de Integrações e WhatsApp Cloud API oficial da Meta.
  x-module: api-sagb
servers:
  - url: https://sagb.grupob.com.br/api-sagb/v1
    description: Produção oficial SagB
  - url: https://{branch}--sagbapp.netlify.app/api-sagb/v1
    description: Branch preview Netlify. Substituir {branch} pelo slug real do preview.
    variables:
      branch:
        default: review-finalizacao-api-sagb
        description: Slug da branch/preview no Netlify.
  - url: http://localhost:8888/api-sagb/v1
    description: Desenvolvimento local Netlify CLI
security:
  - ApiKeyAuth: []
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API Key armazenada no SagB apenas como SHA-256 em api_keys.key_hash.
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: FORBIDDEN
            message:
              type: string
              example: Insufficient scopes.
            details:
              nullable: true
    HealthResponse:
      type: object
      properties:
        status: { type: string, example: ok }
        version: { type: string, example: 1.1.1 }
        timestamp: { type: string, format: date-time }
        module: { type: string, example: api-sagb }
    StatusResponse:
      type: object
      properties:
        status: { type: string, enum: [ok, degraded] }
        version: { type: string }
        environment: { type: string }
        supabase: { $ref: '#/components/schemas/ComponentStatus' }
        hub:
          type: object
        providers:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ComponentStatus'
        whatsapp:
          $ref: '#/components/schemas/ComponentStatus'
    ComponentStatus:
      type: object
      properties:
        status: { type: string, example: configured }
        configured: { type: boolean }
        secrets_exposed: { type: boolean, example: false }
        driver: { type: string, example: temporary_router_cloud_api_bridge }
        required_env:
          type: array
          items: { type: string }
    EventPayload:
      type: object
      required: [event_type, source, context, resource]
      properties:
        event_type: { type: string, example: whatsapp.message.received }
        source:
          type: object
          required: [type, id]
          properties:
            type: { type: string, enum: [module, system, integration, agent, external] }
            id: { type: string }
        context:
          type: object
          properties:
            type: { type: string, enum: [global, qg, module, client, conversation, integration] }
            id: { type: string }
        resource:
          type: object
          properties:
            type: { type: string }
            id: { type: string }
        payload: { type: object, additionalProperties: true }
        metadata: { type: object, additionalProperties: true }
    ApiEvent:
      allOf:
        - $ref: '#/components/schemas/EventPayload'
        - type: object
          properties:
            id: { type: string, format: uuid }
            request_id: { type: string, format: uuid }
            client_id: { type: string }
            created_at: { type: string, format: date-time }
    IntegrationActionPayload:
      type: object
      required: [action]
      properties:
        action: { type: string, example: send-message }
        payload: { type: object, additionalProperties: true }
    IntegrationAction:
      type: object
      properties:
        id: { type: string, format: uuid }
        provider: { type: string }
        action: { type: string }
        status: { type: string, enum: [running, success, failure] }
        request_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
    WhatsAppWebhookPayload:
      type: object
      description: Payload oficial enviado pela Meta WhatsApp Business Platform.
      additionalProperties: true
    WhatsAppSendMessagePayload:
      type: object
      required: [to]
      properties:
        to: { type: string, example: '5511999999999' }
        type: { type: string, enum: [text, template, image, audio, video, document], default: text }
        text:
          oneOf:
            - type: string
            - type: object
              properties:
                body: { type: string }
        message: { type: string }
        template: { type: object, additionalProperties: true }
        media: { type: object, additionalProperties: true }
    WhatsAppConversation:
      type: object
      properties:
        id: { type: string, format: uuid }
        contact_id: { type: string, format: uuid }
        status: { type: string }
        origin: { type: string }
        last_message_at: { type: string, format: date-time }
    WhatsAppMessage:
      type: object
      properties:
        id: { type: string, format: uuid }
        conversation_id: { type: string, format: uuid }
        provider_message_id: { type: string }
        direction: { type: string, enum: [inbound, outbound] }
        type: { type: string }
        text: { type: string, nullable: true }
        status: { type: string }
        created_at: { type: string, format: date-time }
    Notification:
      type: object
    Lead:
      type: object
    StudioProject:
      type: object
    StudioProjectDetail:
      type: object
    Transcription:
      type: object
    TranscribePayload:
      type: object
      required: [audio_url]
      properties:
        audio_url: { type: string, format: uri }
    SendNotificationPayload:
      type: object
      required: [title, message, type, recipient_ids]
      properties:
        title: { type: string }
        message: { type: string }
        type: { type: string }
        recipient_ids:
          type: array
          items: { type: string }
    CreateLeadPayload:
      type: object
      required: [name]
      properties:
        name: { type: string }
        email: { type: string }
        phone: { type: string }
    UpdateLeadPayload:
      type: object
      properties:
        name: { type: string }
        status: { type: string }
  responses:
    BadRequest:
      description: Requisição inválida.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: API Key ausente, inválida, expirada, inativa ou revogada.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Escopo insuficiente.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Recurso não encontrado.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    UpstreamError:
      description: Erro em Supabase, Hub ou provider externo.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
paths:
  /health:
    get:
      tags: [System]
      summary: Healthcheck da API SagB.
      security: [{ ApiKeyAuth: [system:read] }]
      responses:
        '200': { description: API online, content: { application/json: { schema: { $ref: '#/components/schemas/HealthResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /status:
    get:
      tags: [System]
      summary: Status operacional real da API, Supabase, Hub e providers.
      security: [{ ApiKeyAuth: [system:read] }]
      responses:
        '200': { description: Status operacional, content: { application/json: { schema: { $ref: '#/components/schemas/StatusResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /events:
    post:
      tags: [Events]
      summary: Registra evento universal no SagB.
      security: [{ ApiKeyAuth: [events:write] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventPayload' }
      responses:
        '201': { description: Evento persistido, content: { application/json: { schema: { type: object, properties: { event: { $ref: '#/components/schemas/ApiEvent' } } } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    get:
      tags: [Events]
      summary: Lista eventos universais.
      security: [{ ApiKeyAuth: [events:read] }]
      responses:
        '200': { description: Eventos, content: { application/json: { schema: { type: object, properties: { events: { type: array, items: { $ref: '#/components/schemas/ApiEvent' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /events/{id}:
    get:
      tags: [Events]
      summary: Obtém evento por ID.
      security: [{ ApiKeyAuth: [events:read] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Evento, content: { application/json: { schema: { type: object, properties: { event: { $ref: '#/components/schemas/ApiEvent' } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /integrations:
    get:
      tags: [Integrations]
      summary: Lista providers registrados no Hub.
      security: [{ ApiKeyAuth: [integrations:read] }]
      responses:
        '200': { description: Providers, content: { application/json: { schema: { type: object } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /integrations/{provider}/status:
    get:
      tags: [Integrations]
      summary: Consulta status de provider.
      security: [{ ApiKeyAuth: [integrations:read] }]
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string, enum: [whatsapp, clickup, gmail, titan, meta_facebook, google_calendar, supabase] } }
      responses:
        '200': { description: Status do provider, content: { application/json: { schema: { $ref: '#/components/schemas/ComponentStatus' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /integrations/{provider}/actions:
    post:
      tags: [Integrations]
      summary: Executa ação em provider via Hub de Integrações.
      security: [{ ApiKeyAuth: [integrations:execute] }]
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IntegrationActionPayload' }
      responses:
        '202': { description: Ação aceita/executada, content: { application/json: { schema: { type: object } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /integrations/actions/{actionId}:
    get:
      tags: [Integrations]
      summary: Consulta resultado de action.
      security: [{ ApiKeyAuth: [integrations:read] }]
      parameters:
        - { name: actionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Action, content: { application/json: { schema: { type: object, properties: { action: { $ref: '#/components/schemas/IntegrationAction' } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /integrations/whatsapp/webhook:
    get:
      tags: [WhatsApp]
      summary: Verificação do webhook da Meta.
      security: []
      parameters:
        - { name: hub.mode, in: query, required: true, schema: { type: string } }
        - { name: hub.verify_token, in: query, required: true, schema: { type: string } }
        - { name: hub.challenge, in: query, required: true, schema: { type: string } }
      responses:
        '200': { description: Challenge em text/plain }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [WhatsApp]
      summary: Recebe webhook POST da Meta, valida X-Hub-Signature-256 e persiste contatos, conversas, mensagens e status.
      security: []
      parameters:
        - name: X-Hub-Signature-256
          in: header
          required: true
          schema:
            type: string
            example: sha256=example-redacted
          description: Assinatura HMAC SHA-256 da Meta calculada com META_APP_SECRET. Obrigatória em produção; bypass apenas em development/test/sandbox.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WhatsAppWebhookPayload' }
      responses:
        '200': { description: Recebido, content: { application/json: { schema: { type: object } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /integrations/whatsapp/send-message:
    post:
      tags: [WhatsApp]
      summary: Envia mensagem pela Cloud API oficial via Hub.
      security: [{ ApiKeyAuth: [whatsapp:send] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WhatsAppSendMessagePayload' }
      responses:
        '202': { description: Mensagem enviada, content: { application/json: { schema: { type: object } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '502': { $ref: '#/components/responses/UpstreamError' }
  /integrations/whatsapp/conversations:
    get:
      tags: [WhatsApp]
      summary: Lista conversas WhatsApp disponíveis para CRM Ziplia e Núcleo Conversacional.
      security: [{ ApiKeyAuth: [whatsapp:read] }]
      responses:
        '200': { description: Conversas, content: { application/json: { schema: { type: object, properties: { conversations: { type: array, items: { $ref: '#/components/schemas/WhatsAppConversation' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /integrations/whatsapp/conversations/{id}/messages:
    get:
      tags: [WhatsApp]
      summary: Lista mensagens de uma conversa WhatsApp.
      security: [{ ApiKeyAuth: [whatsapp:read, messages:read] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Mensagens, content: { application/json: { schema: { type: object, properties: { messages: { type: array, items: { $ref: '#/components/schemas/WhatsAppMessage' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /taskzei/notifications:
    get:
      tags: [TaskZei]
      summary: Endpoint legado proxy TaskZei.
      security: [{ ApiKeyAuth: [system:read] }]
      responses:
        '200': { description: OK }
    post:
      tags: [TaskZei]
      summary: Endpoint legado proxy TaskZei.
      security: [{ ApiKeyAuth: [system:write] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendNotificationPayload' }
      responses:
        '200': { description: OK }
  /crm/leads:
    get:
      tags: [CRM]
      summary: Endpoint legado proxy CRM.
      security: [{ ApiKeyAuth: [crm:read] }]
      responses:
        '200': { description: OK }
    post:
      tags: [CRM]
      summary: Endpoint legado proxy CRM.
      security: [{ ApiKeyAuth: [crm:write] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateLeadPayload' }
      responses:
        '200': { description: OK }
  /crm/leads/{id}:
    get:
      tags: [CRM]
      summary: Endpoint legado proxy CRM.
      security: [{ ApiKeyAuth: [crm:read] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK }
    put:
      tags: [CRM]
      summary: Endpoint legado proxy CRM.
      security: [{ ApiKeyAuth: [crm:write] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateLeadPayload' }
      responses:
        '200': { description: OK }
  /studio/projects:
    get:
      tags: [Studio]
      summary: Endpoint legado proxy Studio.
      security: [{ ApiKeyAuth: [system:read] }]
      responses:
        '200': { description: OK }
  /studio/projects/{id}:
    get:
      tags: [Studio]
      summary: Endpoint legado proxy Studio.
      security: [{ ApiKeyAuth: [system:read] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK }
  /vox/transcriptions:
    get:
      tags: [Vox]
      summary: Endpoint legado proxy Vox.
      security: [{ ApiKeyAuth: [messages:read] }]
      responses:
        '200': { description: OK }
    post:
      tags: [Vox]
      summary: Endpoint legado proxy Vox.
      security: [{ ApiKeyAuth: [messages:write] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TranscribePayload' }
      responses:
        '200': { description: OK }
  /vox/transcriptions/{id}:
    get:
      tags: [Vox]
      summary: Endpoint legado proxy Vox.
      security: [{ ApiKeyAuth: [messages:read] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK }
